version: '3.8'

services:
  agripulse-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agripulse-predictive-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WARNING_THRESHOLD=0.3017
      - CRITICAL_THRESHOLD=0.3691
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
